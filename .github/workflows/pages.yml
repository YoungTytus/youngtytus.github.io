name: Zbuduj i opublikuj Mapę Socjalu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10.4'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Sprawdź dane, uruchom testy i zbuduj stronę
        run: python aktualizuj_strone.py
      - name: Przygotuj artefakt GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
